<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Snake · Lluís Ridao</title>
<meta name="description" content="El clásico Snake en el navegador: sin anuncios, sin rastreadores y jugable con teclado o con el dedo.">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262a33; --txt:#e8e8ea; --muted:#8b8f99; --snake:#7ee787; --head:#b8f5bd; --food:#ff7b72; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; touch-action:none; }
  h1 { margin:0; font-size:20px; letter-spacing:.04em; font-weight:600; }
  .marcador { display:flex; gap:24px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .marcador b { color:var(--txt); }
  .tablero { position:relative; width:min(92vw,480px); aspect-ratio:1; }
  canvas { width:100%; height:100%; display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .capa { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; background:rgba(15,17,21,.82); border-radius:12px; padding:20px; }
  .capa[hidden] { display:none; }
  .capa p { margin:0; color:var(--muted); max-width:30ch; }
  button { font:inherit; color:var(--bg); background:var(--snake); border:0; border-radius:999px; padding:10px 22px; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--head); outline-offset:3px; }
  .ayuda { color:var(--muted); font-size:13px; text-align:center; }
  footer { color:var(--muted); font-size:13px; }
  footer a { color:var(--txt); }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="marcador"><span>Puntos: <b id="puntos">0</b></span><span>Récord: <b id="record">0</b></span></div>
  <div class="tablero">
    <canvas id="lienzo" width="480" height="480" aria-label="Tablero de juego"></canvas>
    <div class="capa" id="capa">
      <h2 id="titulo" style="margin:0">Snake</h2>
      <p id="mensaje">Come la fruta, crece y no te muerdas la cola.</p>
      <button id="boton">Jugar</button>
    </div>
  </div>
  <p class="ayuda">Flechas o WASD para moverte · Espacio para pausar · En el móvil, desliza el dedo</p>
  <footer>Hecho por <a href="https://www.lluisridao.com">Lluís Ridao</a> · <a href="https://github.com/lluis-ridao/Snake">código</a></footer>

<script>
(() => {
  const N = 20;                       // casillas por lado
  const lienzo = document.getElementById('lienzo');
  const ctx = lienzo.getContext('2d');
  const C = lienzo.width / N;         // tamaño de casilla en píxeles
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  let serpiente, dir, siguiente, comida, puntos, record = 0, vel, temporizador = null, estado = 'inicio';

  try { record = +localStorage.getItem('snake-record') || 0; } catch (e) {}
  $('record').textContent = record;

  function iniciar() {
    serpiente = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0}; siguiente = dir;
    puntos = 0; vel = 140;
    $('puntos').textContent = 0;
    colocarComida();
    estado = 'jugando';
    $('capa').hidden = true;
    reprogramar();
  }

  function colocarComida() {
    do { comida = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)}; }
    while (serpiente.some(s => s.x === comida.x && s.y === comida.y));
  }

  function reprogramar() {
    clearInterval(temporizador);
    temporizador = setInterval(paso, vel);
  }

  function paso() {
    dir = siguiente;
    const cabeza = {x: serpiente[0].x + dir.x, y: serpiente[0].y + dir.y};
    const choca = cabeza.x < 0 || cabeza.y < 0 || cabeza.x >= N || cabeza.y >= N ||
                  serpiente.slice(0, -1).some(s => s.x === cabeza.x && s.y === cabeza.y);
    if (choca) return fin();
    serpiente.unshift(cabeza);
    if (cabeza.x === comida.x && cabeza.y === comida.y) {
      puntos++;
      $('puntos').textContent = puntos;
      if (puntos % 5 === 0 && vel > 60) { vel -= 10; reprogramar(); }
      colocarComida();
    } else {
      serpiente.pop();
    }
    dibujar();
  }

  function fin() {
    clearInterval(temporizador);
    estado = 'fin';
    if (puntos > record) {
      record = puntos;
      $('record').textContent = record;
      try { localStorage.setItem('snake-record', record); } catch (e) {}
    }
    mostrarCapa('Fin de la partida', puntos === 1 ? 'Has hecho 1 punto.' : `Has hecho ${puntos} puntos.`, 'Otra vez');
  }

  function pausar() {
    if (estado === 'jugando') { clearInterval(temporizador); estado = 'pausa'; mostrarCapa('Pausa', 'Pulsa espacio o el botón para seguir.', 'Seguir'); }
    else if (estado === 'pausa') { estado = 'jugando'; $('capa').hidden = true; reprogramar(); }
  }

  function mostrarCapa(t, m, b) {
    $('titulo').textContent = t; $('mensaje').textContent = m; $('boton').textContent = b;
    $('capa').hidden = false; $('boton').focus();
  }

  function cambiarDir(x, y) {
    if (estado !== 'jugando') return;
    if (x === -dir.x && y === -dir.y) return;   // no se puede dar media vuelta
    siguiente = {x, y};
  }

  function dibujar() {
    ctx.fillStyle = css('--panel'); ctx.fillRect(0, 0, lienzo.width, lienzo.height);
    ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * C + .5, 0); ctx.lineTo(i * C + .5, lienzo.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * C + .5); ctx.lineTo(lienzo.width, i * C + .5); ctx.stroke();
    }
    ctx.fillStyle = css('--food');
    ctx.beginPath(); ctx.arc(comida.x * C + C / 2, comida.y * C + C / 2, C * .36, 0, Math.PI * 2); ctx.fill();
    serpiente.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? css('--head') : css('--snake');
      const m = i === 0 ? 1.5 : 2.5;
      ctx.beginPath(); ctx.roundRect(s.x * C + m, s.y * C + m, C - m * 2, C - m * 2, 5); ctx.fill();
    });
  }

  // Teclado
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const mapa = {arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0]};
    if (mapa[k]) { e.preventDefault(); cambiarDir(...mapa[k]); }
    else if (k === ' ') { e.preventDefault(); if (estado === 'inicio' || estado === 'fin') iniciar(); else pausar(); }
  });

  // Gestos en el móvil
  let t0 = null;
  addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive: true});
  addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    Math.abs(dx) > Math.abs(dy) ? cambiarDir(Math.sign(dx), 0) : cambiarDir(0, Math.sign(dy));
  });

  $('boton').addEventListener('click', () => (estado === 'pausa' ? pausar() : iniciar()));

  // Tablero de fondo antes de empezar
  serpiente = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}]; comida = {x: 14, y: 10};
  dibujar();
})();
</script>
</body>
</html>
